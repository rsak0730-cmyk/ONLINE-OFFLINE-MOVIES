<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncBeat Ludo Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.3/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
        body, html { width: 100vw; height: 100vh; background: #07070a; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        .arcade-header { padding: 12px 16px; background: #121218; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 10; }
        .arcade-title { font-size: 13px; font-weight: 900; color: #ef4444; display: flex; align-items: center; gap: 8px; }

        .game-arena { flex: 1; background: #0a0a0f; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
        
        /* Realistic Ludo Board */
        .ludo-board { width: 88vw; height: 88vw; max-width: 360px; max-height: 360px; background: #fff; border: 4px solid #1e293b; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.8); border-radius: 6px; }
        .base { position: absolute; width: 40%; height: 40%; border: 2px solid #1e293b; display: flex; align-items: center; justify-content: center; }
        .base-inner { width: 68%; height: 68%; background: #fff; border-radius: 8px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); position: relative; }
        .red { top: 0; left: 0; background: #ef4444; }
        .green { top: 0; right: 0; background: #22c55e; }
        .blue { bottom: 0; left: 0; background: #3b82f6; }
        .yellow { bottom: 0; right: 0; background: #eab308; }
        .center-home { position: absolute; top: 40%; left: 40%; width: 20%; height: 20%; background: #cbd5e1; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); border: 1px solid #94a3b8; }

        .token { position: absolute; width: 13%; height: 13%; border-radius: 50%; border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 4px 8px rgba(0,0,0,0.6); cursor: grab; transform: translate(-50%, -50%); transition: left 0.04s, top 0.04s; z-index: 15; }
        .token:active { cursor: grabbing; transform: translate(-50%, -50%) scale(1.25); box-shadow: 0 8px 16px rgba(0,0,0,0.8); z-index: 100; }

        .dice-btn { width: 55px; height: 55px; background: #fff; border-radius: 12px; border: 3px solid #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #0f172a; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        .rolling { animation: shake 0.4s ease-in-out infinite alternate; pointer-events: none; }
        @keyframes shake { 0% { transform: rotate(-15deg); } 100% { transform: rotate(15deg); } }

        /* Social UI */
        .social-drawer { height: 140px; background: rgba(14, 14, 18, 0.95); display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.08); z-index: 10; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; max-width: 85%; }
        .chat-input-bar { padding: 6px 10px; display: flex; gap: 6px; background: rgba(0,0,0,0.3); }
        .chat-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 10px; color: #fff; font-size: 11px; outline: none; }
        .chat-send { background: #ef4444; border: none; color: #fff; padding: 0 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px; }

        #roomSetupModal { position: absolute; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .setup-card { background: #121218; width: 100%; max-width: 300px; border-radius: 20px; padding: 20px; border: 1px solid rgba(239, 68, 68, 0.3); text-align: center; }
        .input-glass { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; font-size: 13px; color: #fff; outline: none; margin-bottom: 12px; text-align: center; }
        .btn-glass { width: 100%; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; border: none; margin-bottom: 8px; }
        .btn-host { background: #ef4444; color: #fff; }
        .btn-join { background: #3b82f6; color: #fff; }
    </style>
</head>
<body>

    <div class="arcade-header">
        <div class="arcade-title" id="roomTitle"><i class="fa-solid fa-chess-board"></i> SyncBeat Ludo</div>
        <button id="leaveBtn" style="display:none; background:#ef4444; border:none; color:#fff; padding:5px 10px; border-radius:6px; font-size:10px; font-weight:800; cursor:pointer;" onclick="leaveGame()">Quit Match</button>
    </div>

    <div class="game-arena">
        <div class="ludo-board" id="board">
            <div class="base red"><div class="base-inner"></div></div>
            <div class="base green"><div class="base-inner"></div></div>
            <div class="base blue"><div class="base-inner"></div></div>
            <div class="base yellow"><div class="base-inner"></div></div>
            <div class="center-home"></div>
        </div>

        <div class="dice-btn" id="dice" onclick="rollDice()">
            <i class="fa-solid fa-dice-one" id="diceIcon"></i>
        </div>
    </div>

    <div class="social-drawer">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg" style="color: #ef4444;">System: Enter a room code to start match.</div>
        </div>
        <div class="chat-input-bar">
            <input type="text" id="chatInput" class="chat-input" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="chat-send" onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <div id="roomSetupModal">
        <div class="setup-card">
            <div style="font-size: 15px; font-weight: 800; color: #ef4444; margin-bottom: 12px;">Ludo Multiplayer</div>
            <input type="text" id="roomCodeInput" class="input-glass" placeholder="Enter Room Code">
            <button class="btn-glass btn-host" onclick="joinGame('host')">Host Match</button>
            <button class="btn-glass btn-join" onclick="joinGame('join')">Join Match</button>
        </div>
    </div>

    <script>
        const socket = io('https://syncbeat-server-pvix.onrender.com');
        let activeCode = null;
        let activeToken = null;

        // Initialize 16 Tokens inside Base Corners
        const board = document.getElementById('board');
        const tokenConfigs = [
            {c:'#ef4444', bx:20, by:20}, {c:'#22c55e', bx:80, by:20}, 
            {c:'#3b82f6', bx:20, by:80}, {c:'#eab308', bx:80, by:80}
        ];
        
        let tid = 0;
        tokenConfigs.forEach(cfg => {
            for(let i=0; i<4; i++) {
                let ox = (i%2===0)?-9:9; let oy = (i<2)?-9:9;
                let t = document.createElement('div');
                t.className = 'token'; t.id = `t${tid++}`;
                t.style.background = cfg.c; 
                t.style.left = (cfg.bx + ox) + '%'; 
                t.style.top = (cfg.by + oy) + '%';
                
                t.addEventListener('pointerdown', (e) => { activeToken = t; e.stopPropagation(); });
                board.appendChild(t);
            }
        });

        board.addEventListener('pointermove', (e) => {
            if (!activeToken) return;
            const rect = board.getBoundingClientRect();
            let x = ((e.clientX - rect.left) / rect.width) * 100;
            let y = ((e.clientY - rect.top) / rect.height) * 100;
            activeToken.style.left = Math.max(0, Math.min(100, x)) + '%';
            activeToken.style.top = Math.max(0, Math.min(100, y)) + '%';
            
            socket.emit('move_piece', { room: activeCode, id: activeToken.id, x: activeToken.style.left, y: activeToken.style.top });
        });
        document.addEventListener('pointerup', () => activeToken = null);

        socket.on('receive_move', (data) => {
            const t = document.getElementById(data.id);
            if(t) { t.style.left = data.x; t.style.top = data.y; }
        });

        function joinGame(type) {
            let code = document.getElementById('roomCodeInput').value.trim();
            if (type === 'host') code = 'LUDO-' + Math.floor(1000 + Math.random() * 9000);
            if (!code) return alert("Enter code!");
            activeCode = code;
            socket.emit('join_room', code);
            
            document.getElementById('roomSetupModal').style.display = 'none';
            document.getElementById('leaveBtn').style.display = 'block';
            document.getElementById('roomTitle').innerHTML = `<i class="fa-solid fa-chess-board"></i> LUDO [${code}]`;
            
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_OPENED', tab: 3, code: code }, '*');
        }

        function leaveGame() {
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_CLOSED' }, '*');
            location.reload();
        }

        const diceIcons = ['fa-dice-one', 'fa-dice-two', 'fa-dice-three', 'fa-dice-four', 'fa-dice-five', 'fa-dice-six'];
        function rollDice() {
            const dice = document.getElementById('dice');
            dice.classList.add('rolling');
            const res = Math.floor(Math.random() * 6);
            socket.emit('roll_dice', { room: activeCode, result: res });
            setTimeout(() => { dice.classList.remove('rolling'); document.getElementById('diceIcon').className = `fa-solid ${diceIcons[res]}`; }, 500);
        }
        socket.on('receive_dice', (res) => {
            const dice = document.getElementById('dice'); dice.classList.add('rolling');
            setTimeout(() => { dice.classList.remove('rolling'); document.getElementById('diceIcon').className = `fa-solid ${diceIcons[res]}`; }, 500);
        });

        function sendChatMessage() {
            const txt = document.getElementById('chatInput').value.trim();
            if(!txt) return;
            document.getElementById('chatMessages').innerHTML += `<div class="chat-msg self"><b>You:</b> ${txt}</div>`;
            socket.emit('send_chat', { room: activeCode, message: txt });
            document.getElementById('chatInput').value = '';
        }
        socket.on('receive_chat', (msg) => document.getElementById('chatMessages').innerHTML += `<div class="chat-msg"><b>Opponent:</b> ${msg}</div>`);
    </script>
</body>
</html>
