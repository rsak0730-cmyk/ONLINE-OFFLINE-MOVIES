<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat - Unified Watch Party & Audio Hub</title>
    <meta name="description" content="Multi-Device Real-Time Room Synchronization and Watch Party platform for movies, YouTube, and music.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #07070a; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #f8fafc; }
        
        #slider { display: flex; width: 300vw; height: 100vh; transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }
        .tab-pane { width: 100vw; height: 100vh; overflow-y: auto; padding: 16px; padding-bottom: 100px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }

        /* Glass Cards */
        .glass-card { background: rgba(22, 22, 30, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 22px; padding: 18px; box-shadow: 0 16px 36px rgba(0,0,0,0.4); }
        .card-header { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; color: #f43f5e; }
        .input-glass { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 13px 16px; font-size: 14px; color: #fff; outline: none; }
        .btn-glass { width: 100%; padding: 14px; border-radius: 14px; font-size: 13px; font-weight: 800; cursor: pointer; border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* iOS Liquid Glass Tab Bar */
        .tab-bar {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(0);
            width: 90%; max-width: 350px; height: 56px;
            background: rgba(16, 16, 22, 0.85); backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
            z-index: 10000; box-shadow: 0 18px 40px rgba(0,0,0,0.7); transition: transform 0.4s ease, opacity 0.4s ease;
        }
        .tab-bar.hide { transform: translateX(-50%) translateY(120px); opacity: 0; pointer-events: none; }
        .indicator { position: absolute; top: 5px; bottom: 5px; width: calc(33.333% - 8px); left: 6px; background: rgba(244, 63, 94, 0.28); border-radius: 24px; transition: left 0.45s cubic-bezier(0.25, 1, 0.5, 1); z-index: 1; }
        .tab-btn { flex: 1; height: 100%; border: none; background: transparent; color: rgba(255,255,255,0.42); font-size: 10px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; z-index: 2; cursor: pointer; text-transform: uppercase; position: relative; }
        .tab-btn i { font-size: 16px; }
        .tab-btn.active { color: #fff; }
        .tab-btn .lock { position: absolute; top: 6px; right: 16px; font-size: 9px; color: #ef4444; opacity: 0; }
        .tab-bar.locked .tab-btn:not(.active) .lock { opacity: 1; }
        .tab-bar.locked { border-color: rgba(239, 68, 68, 0.6); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

        /* Splash Screen */
        #videoSplashOverlay { position: fixed; inset: 0; background: #000; z-index: 99999999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
        #videoSplashOverlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        #splashVideo { width: 100%; height: 100%; object-fit: cover; }

        /* Toast */
        #toast { position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-120px); background: rgba(20, 8, 8, 0.95); border: 1px solid rgba(239, 68, 68, 0.6); color: #fecaca; padding: 12px 20px; border-radius: 20px; font-size: 12px; font-weight: 800; z-index: 100000; transition: transform 0.4s ease; pointer-events: none; }
        #toast.show { transform: translateX(-50%) translateY(0); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="videoSplashOverlay">
        <video id="splashVideo" autoplay muted playsinline preload="auto"><source src="intro.mp4" type="video/mp4"></video>
    </div>

    <div id="toast"><i class="fa-solid fa-lock" style="color: #ef4444;"></i> <span id="toastMsg"></span></div>

    <div id="slider">
        <!-- TAB 0: MOVIES -->
        <div class="tab-pane" style="background:#07070a;">
            <div class="container">
                <h1 style="font-size:22px; font-weight:900; color:#f43f5e;">STREAMFLIX</h1>
                <div class="glass-card">
                    <div class="card-header">Movies & Local Sync</div>
                    <input type="text" id="m-code" class="input-glass" placeholder="Room Code (e.g. SYNC-1234)" style="margin-bottom:10px;">
                    <button class="btn-glass" style="background:#f43f5e; color:#fff;" onclick="alert('Host/Join initialized!')">Host Room</button>
                </div>
            </div>
        </div>
        <!-- TAB 1: GOLDEN -->
        <div class="tab-pane" style="background:#07070a;">
            <div class="container">
                <h1 style="font-size:22px; font-weight:900; color:#f59e0b;">GOLDEN ROOM</h1>
                <div class="glass-card">
                    <div class="card-header" style="color:#f59e0b;">YouTube Watch Party</div>
                    <input type="text" id="g-code" class="input-glass" placeholder="Room Code" style="margin-bottom:10px;">
                    <button class="btn-glass" style="background:#f59e0b; color:#000;" onclick="alert('Golden Room initialized!')">Host Golden</button>
                </div>
            </div>
        </div>
        <!-- TAB 2: AUDIO -->
        <div class="tab-pane" style="background:#07070a;">
            <div class="container">
                <h1 style="font-size:22px; font-weight:900; color:#a855f7;">AUDIO SYNC</h1>
                <div class="glass-card">
                    <div class="card-header" style="color:#a855f7;">Music Controller</div>
                    <input type="text" id="a-code" class="input-glass" placeholder="Room Code" style="margin-bottom:10px;">
                    <button class="btn-glass" style="background:#a855f7; color:#fff;" onclick="alert('Audio Sync initialized!')">Host Audio</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="tab-bar" id="tabBar">
        <div class="indicator" id="indicator"></div>
        <button class="tab-btn active" onclick="switchTab(0, '#f43f5e')"><i class="fa-solid fa-film"></i><span>Movies</span><i class="fa-solid fa-lock lock"></i></button>
        <button class="tab-btn" onclick="switchTab(1, '#f59e0b')"><i class="fa-brands fa-youtube"></i><span>Golden</span><i class="fa-solid fa-lock lock"></i></button>
        <button class="tab-btn" onclick="switchTab(2, '#a855f7')"><i class="fa-solid fa-compact-disc"></i><span>Audio</span><i class="fa-solid fa-lock lock"></i></button>
    </nav>

    <script>
        // Splash Screen
        const splash = document.getElementById('videoSplashOverlay');
        const vid = document.getElementById('splashVideo');
        function closeSplash() { if(splash) { splash.classList.add('fade-out'); setTimeout(() => splash.remove(), 600); } }
        if (localStorage.getItem('seen_intro')) { splash.remove(); } 
        else { localStorage.setItem('seen_intro', 'true'); vid.onended = closeSplash; vid.onerror = closeSplash; setTimeout(closeSplash, 7000); }

        // Tabs & Navigation
        function switchTab(index, color) {
            document.getElementById('slider').style.transform = `translateX(-${index * 100}vw)`;
            const pos = ['6px', 'calc(33.333% + 1px)', 'calc(66.666% - 4px)'];
            document.getElementById('indicator').style.left = pos[index];
            document.getElementById('indicator').style.background = color + '40';
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', i === index);
                b.style.color = i === index ? '#fff' : 'rgba(255,255,255,0.4)';
            });
        }
    </script>
</body>
</html>
