<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat - Unified Hub</title>
    <meta name="description" content="Multi-Device Real-Time Room Synchronization and Watch Party platform for movies, YouTube, and music.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* LOOK redesign only — hub chrome neumorphism; all JS/functions unchanged */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            position: fixed;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            overscroll-behavior: none;
            background: #E8EDF5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #slider { display: flex; width: 300vw; height: 100vh; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }
        .frame-wrapper { width: 100vw; height: 100vh; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #E8EDF5; }

        .tab-bar {
            position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(0);
            width: 90%; max-width: 360px; height: 64px;
            background: #EEF2F8;
            border: none;
            border-radius: 28px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
            box-shadow:
                10px 10px 24px #A3B1C6,
                -10px -10px 24px #FFFFFF,
                inset 1px 1px 0 rgba(255,255,255,0.7);
            z-index: 10000;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
        }
        .tab-bar.hide { transform: translateX(-50%) translateY(120px); opacity: 0; pointer-events: none; }

        .indicator {
            position: absolute; top: 7px; bottom: 7px; width: calc(33.333% - 10px); left: 8px;
            background: linear-gradient(145deg, #6C63FF, #5548E0);
            border-radius: 22px;
            box-shadow: 4px 4px 12px rgba(108,99,255,0.35);
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease;
            z-index: 1;
        }

        .tab-btn {
            flex: 1; height: 100%; border: none; background: transparent;
            color: #7F8C8D;
            font-size: 10px; font-weight: 800;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            z-index: 2; cursor: pointer; transition: color 0.3s ease;
            text-transform: uppercase; letter-spacing: 0.5px; position: relative;
        }
        .tab-btn i { font-size: 18px; transition: transform 0.3s cubic-bezier(0.2, 2, 0.4, 1); }
        .tab-btn.active { color: #fff !important; }
        .tab-btn.active i { transform: translateY(-2px) scale(1.1); }
        .tab-btn .lock { position: absolute; top: 6px; right: 18px; font-size: 9px; color: #6C63FF; opacity: 0; transition: 0.3s ease; }
        .tab-bar.locked .tab-btn:not(.active) .lock { opacity: 1; }
        .tab-bar.locked {
            box-shadow:
                10px 10px 24px #A3B1C6,
                -10px -10px 24px #FFFFFF,
                0 0 0 2px rgba(108,99,255,0.35);
        }

        #toast {
            position: fixed; top: 28px; left: 50%; transform: translateX(-50%) translateY(-120px);
            background: #EEF2F8;
            color: #2D3436;
            padding: 12px 20px; border-radius: 20px; font-size: 12px; font-weight: 800;
            box-shadow: 8px 8px 20px #A3B1C6, -8px -8px 20px #FFFFFF;
            z-index: 100000; display: flex; align-items: center; gap: 8px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none; text-align: center;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        #videoSplashOverlay {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background-color: #E8EDF5; z-index: 99999999;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s ease;
        }
        #videoSplashOverlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        #splashVideo { width: 100%; height: 100%; object-fit: cover; background: #E8EDF5; }
        #skipSplashBtn {
            position: absolute; top: 40px; right: 20px;
            background: #EEF2F8;
            border: none;
            color: #2D3436;
            font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            padding: 10px 18px; border-radius: 20px; cursor: pointer; z-index: 10;
            box-shadow: 6px 6px 14px #A3B1C6, -6px -6px 14px #FFFFFF;
        }
    </style>
</head>
<body>

    <!-- Fullscreen Animated Video Splash Screen -->
    <div id="videoSplashOverlay">
        <video id="splashVideo" autoplay muted playsinline preload="auto">
            <source src="intro.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
        <button id="skipSplashBtn" onclick="dismissSplashScreen()">Skip</button>
    </div>

    <div id="toast"><i class="fa-solid fa-lock" style="color: #6C63FF;"></i> <span id="toastMsg"></span></div>

    <div id="slider">
        <div class="frame-wrapper"><iframe src="./movies.html" allow="autoplay; fullscreen"></iframe></div>
        <div class="frame-wrapper"><iframe src="./golden.html" allow="autoplay; fullscreen"></iframe></div>
        <div class="frame-wrapper"><iframe src="./audio.html" allow="autoplay; fullscreen"></iframe></div>
    </div>

    <nav class="tab-bar" id="tabBar">
        <div class="indicator" id="indicator"></div>
        <button class="tab-btn active" onclick="switchTab(0, '#6C63FF')">
            <i class="fa-solid fa-film"></i><span>Movies</span><i class="fa-solid fa-lock lock"></i>
        </button>
        <button class="tab-btn" onclick="switchTab(1, '#00C9A7')">
            <i class="fa-brands fa-youtube"></i><span>Golden</span><i class="fa-solid fa-lock lock"></i>
        </button>
        <button class="tab-btn" onclick="switchTab(2, '#9B8CFF')">
            <i class="fa-solid fa-compact-disc"></i><span>Audio</span><i class="fa-solid fa-lock lock"></i>
        </button>
    </nav>

    <script>
        // --- Splash Screen Controller ---
        const splashOverlay = document.getElementById('videoSplashOverlay');
        const splashVid = document.getElementById('splashVideo');

        function dismissSplashScreen() {
            if (!splashOverlay || splashOverlay.classList.contains('fade-out')) return;
            
            splashOverlay.classList.add('fade-out');
            
            setTimeout(() => {
                if (splashVid) {
                    splashVid.pause();
                    splashVid.removeAttribute('src');
                    splashVid.load();
                }
                splashOverlay.remove();
            }, 650);
        }

        if (localStorage.getItem('syncbeat_seen_intro')) {
            splashOverlay.remove();
        } else {
            localStorage.setItem('syncbeat_seen_intro', 'true');
            if (splashVid) {
                splashVid.addEventListener('ended', dismissSplashScreen);
                splashVid.addEventListener('error', dismissSplashScreen);
                setTimeout(dismissSplashScreen, 8000); 
            }
        }

        // --- Core Tab & Lock Logic ---
        let currentTab = 0;
        let activeRoomTab = null;
        let activeRoomCode = null;

        const slider = document.getElementById('slider');
        const indicator = document.getElementById('indicator');
        const tabBar = document.getElementById('tabBar');
        const toast = document.getElementById('toast');
        const tabBtns = document.querySelectorAll('.tab-btn');

        let hasEnteredFullscreen = false;
        document.body.addEventListener('click', () => {
            if (!hasEnteredFullscreen) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => console.warn(err));
                } else if (document.documentElement.webkitRequestFullscreen) { 
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) { 
                    document.documentElement.msRequestFullscreen();
                }
                hasEnteredFullscreen = true;
            }
        });

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (data.sender !== 'syncbeat') return;

            if (data.action === 'ROOM_OPENED') {
                activeRoomTab = data.tab;
                activeRoomCode = data.code;
                tabBar.classList.add('locked');
            } else if (data.action === 'ROOM_CLOSED') {
                activeRoomTab = null;
                activeRoomCode = null;
                tabBar.classList.remove('locked');
                tabBar.classList.remove('hide'); 
            } else if (data.action === 'MEDIA_PLAYING') {
                tabBar.classList.add('hide');
            } else if (data.action === 'MEDIA_PAUSED') {
                tabBar.classList.remove('hide');
            }
        });

        window.addEventListener('click', () => {
            if (tabBar.classList.contains('hide')) {
                tabBar.classList.remove('hide');
                setTimeout(() => { if (activeRoomTab !== null) tabBar.classList.add('hide'); }, 3000);
            }
        });

        function switchTab(index, color) {
            if (activeRoomTab !== null && activeRoomTab !== index) {
                const names = ['Movies', 'Golden Room', 'Audio Sync'];
                document.getElementById('toastMsg').textContent = `Active Room in ${names[activeRoomTab]} (${activeRoomCode}). Close it first!`;
                toast.classList.add('show');
                tabBar.style.transform = 'translateX(-50%) scale(0.95)';
                setTimeout(() => tabBar.style.transform = 'translateX(-50%) scale(1)', 150);
                setTimeout(() => toast.classList.remove('show'), 3500);
                return;
            }

            slider.style.transform = `translateX(-${index * 100}vw)`;
            const pos = ['6px', 'calc(33.333% + 1px)', 'calc(66.666% - 4px)'];
            indicator.style.left = pos[index];
            indicator.style.background = color + '40';

            tabBtns.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
                btn.style.color = i === index ? '#fff' : 'rgba(255,255,255,0.4)';
            });
        }
    </script>
</body>
</html>
