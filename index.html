    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #slider {
            display: flex;
            width: 300vw;
            height: 100vh;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            background: #000;
        }

        /* iOS 27 Liquid Glass Tab Bar */
        .liquid-tab-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 420px;
            height: 75px;
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(30px) saturate(250%);
            -webkit-backdrop-filter: blur(30px) saturate(250%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 99999;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .tab-indicator {
            position: absolute;
            top: 10px;
            bottom: 10px;
            width: calc(33.33% - 13px);
            background: rgba(239, 68, 68, 0.25);
            border-radius: 30px;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), left 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.4s ease;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .tab-btn {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            z-index: 2;
            cursor: pointer;
            transition: color 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-btn i { font-size: 22px; transition: transform 0.5s cubic-bezier(0.2, 2, 0.4, 1); }
        .tab-btn.active { color: #fff; }
        .tab-btn.active i { transform: translateY(-4px) scale(1.15); }
    </style>
</head>

    <div id="interactionOverlay" class="hidden" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.92); z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; text-align:center;">

        function searchImdbMovies(query) {
            const resultsBox = document.getElementById('movieSearchResults'); if (!query || query.trim().length < 2) { resultsBox.style.display = 'none'; return; }

                    const res = await fetch(url); if (!res.ok) throw new Error("TMDb API failed");

                    if (results.length === 0) { resultsBox.innerHTML = '<div style="padding:8px; font-size:12px; color:#6b7280; text-align:center;">No titles found. Try another search.</div>'; } else {
                        results.forEach(movie => {

                            resultsBox.appendChild(itemDiv);
                        });
                    }
                    resultsBox.style.display = 'block';
                } catch (e) { resultsBox.innerHTML = '<div style="padding:8px; font-size:11px; color:#ef4444;">Search connection failed. Try again.</div>'; resultsBox.style.display = 'block'; }
            }, 300);
        }
        function loadImdbMovie(imdbId, title, posterUrl, year) { if (!isHosting) return; switchHostMode('online'); currentOnlineImdbId = imdbId; currentOnlineTitle = title; currentOnlinePoster = posterUrl; currentOnlineYear = year; document.getElementById('serverSelector').classList.remove('hidden'); switchOnlineServer(1); }
        function switchOnlineServer(serverNum) { if (!isHosting || !currentOnlineImdbId) return; activeOnlineServer = serverNum; document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('srvBtn' + serverNum).classList.add('active'); applyOnlineServer(serverNum); }

            updatePlayerUI(currentOnlineTitle, currentOnlineYear, currentOnlinePoster, embedUrl);
            if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ type: 'PLAY_IFRAME', imdbId: currentOnlineImdbId, title: currentOnlineTitle, posterUrl: currentOnlinePoster, year: currentOnlineYear, embedUrl: embedUrl })); }

        function initStreamflixPlayerListeners() { if (!streamflixPlayer) { streamflixPlayer = document.getElementById('localVideoPlayer'); streamflixPlayer.addEventListener('play', () => { isSessionPlaying = true; document.getElementById('sessionPlayBtn').textContent = "⏸"; startProgressTracker(); if (isHosting && ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ type: 'CONTROL', action: 'play', time: streamflixPlayer.currentTime })); } }); streamflixPlayer.addEventListener('pause', () => { isSessionPlaying = false; document.getElementById('sessionPlayBtn').textContent = "▶"; if (isHosting && ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ type: 'CONTROL', action: 'pause', time: streamflixPlayer.currentTime })); } }); } }

        function stopLocalPlayer() { if (streamflixPlayer) { streamflixPlayer.pause(); streamflixPlayer.removeAttribute('src'); streamflixPlayer.load(); } clearInterval(progressInterval); }
        function startProgressTracker() { clearInterval(progressInterval); progressInterval = setInterval(() => { if (isScrubbing || !streamflixPlayer) return; const current = streamflixPlayer.currentTime || 0; const total = streamflixPlayer.duration || 0; if (!isNaN(total) && total > 0) { document.getElementById('sessionFill').style.width = ((current / total) * 100) + '%'; document.getElementById('sessionCurrentTime').textContent = formatTime(current); document.getElementById('sessionTotalDuration').textContent = formatTime(total); } }, 500); }
        function formatTime(seconds) { const mins = Math.floor(seconds / 60); const secs = Math.floor(seconds % 60); return `${mins}:${secs < 10 ? '0' : ''}${secs}`; }
        function startScrubbing(event) { if (!isHosting || activeSyncMode !== 'local') return; isScrubbing = true; updateSliderPosition(event); const onTouch = (e) => updateSliderPosition(e.touches ? e.touches[0] : e); const onMouse = (e) => updateSliderPosition(e); const onEnd = (e) => { isScrubbing = false; window.removeEventListener('mousemove', onMouse); window.removeEventListener('mouseup', onEnd); window.removeEventListener('touchmove', onTouch); window.removeEventListener('touchend', onEnd); finalizeSeek(e.clientX || (e.changedTouches ? e.changedTouches[0].clientX : 0)); }; window.addEventListener('mousemove', onMouse); window.addEventListener('mouseup', onEnd); window.addEventListener('touchmove', onTouch); window.addEventListener('touchend', onEnd); }
        function updateSliderPosition(e) { if (!isHosting) return; const track = document.getElementById('progressTrackScrubber'); const rect = track.getBoundingClientRect(); const percentage = Math.max(0, Math.min(1, (e.clientX || (e.touches ? e.touches[0].clientX : 0) - rect.left) / rect.width)); document.getElementById('sessionFill').style.width = (percentage * 100) + '%'; }
        function finalizeSeek(clientX) { if (!isHosting || !streamflixPlayer || isNaN(streamflixPlayer.duration)) return; const track = document.getElementById('progressTrackScrubber'); const rect = track.getBoundingClientRect(); const percentage = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)); const newTime = percentage * streamflixPlayer.duration; streamflixPlayer.currentTime = newTime; if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'CONTROL', action: 'seek', time: newTime })); }
        function seekTrack(event) { if (!isHosting) return; finalizeSeek(event.clientX); }

ts(results) { const container = document.getElementById('searchResults'); container.innerHTML = ''; results.forEach(video => { const item = document.createElement('div'); item.className = "flex flex-col bg-black/20 cursor-pointer hover:bg-black/40 transition pb-4 border-b border-themeBorder/40"; item.onclick = () => { document.getElementById('searchResults').classList.add('hidden'); playSelectedVideo(video); }; item.innerHTML = `<div class="w-full aspect-video bg-black relative overflow-hidden"><img src="${video.thumbUrl}" class="w-full h-full object-cover" onerror="this.src=''" /><span class="absolute bottom-2 right-2 bg-black/80 text-themeText text-xs font-bold px-1.5 py-0.5 rounded shadow-lg">${video.durationText}</span></div><div class="px-3 pt-3 flex items-start space-x-3"><div class="flex-1 min-w-0"><h4 class="text-sm font-semibold text-themeText leading-tight line-clamp-2">${escapeHtml(video.title)}</h4><p class="text-[11px] text-themeMuted mt-1">${escapeHtml(video.uploaderName)}</p></div></div>`; container.appendChild(item); }); container.classList.remove('hidden'); container.classList.add('flex'); } function flashRemoteLed() { const led = document.getElementById('remoteLed'); if(led) { led.style.opacity = '1'; setTimeout(() => { led.style.opacity = '0'; }, 200); } } function toggleHostAudio(isUnmuted) { const statusText = document.getElementById('audioStatusText'); if (isUnmuted) { if (ytPlayer && typeof ytPlayer.unMute === 'function') ytPlayer.unMute(); statusText.textContent = "Playing Locally"; statusText.classList.remove('text-red-400'); statusText.classList.add('text-themeMuted'); } else { if (ytPlayer && typeof ytPlayer.mute === 'function') ytPlayer.mute(); statusText.textContent = "Muted (Remote Only)"; statusText.classList.remove('text-themeMuted'); statusText.classList.add('text-red-400'); } } function triggerBrowserWakeup() { if (ytPlayer && typeof ytPlayer.playVideo === 'function') { ytPlayer.playVideo(); ytPlayer.pauseVideo(); } } function playSelectedVideo(videoData) { flashRemoteLed(); triggerBrowserWakeup(); const mediaMsg = { type: 'PLAY_YOUTUBE', ytId: videoData.videoId, title: videoData.title, artist: videoData.uploaderName, thumb: videoData.thumbUrl, time: 0 }; ws.send(JSON.stringify(mediaMsg)); loadAndPlayYouTube(mediaMsg.ytId, 0, mediaMsg); } function togglePlayPause() { if(!ytPlayer || !ytPlayer.getPlayerState) return; flashRemoteLed(); triggerBrowserWakeup(); const state = ytPlayer.getPlayerState(); if (state === YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); ws.send(JSON.stringify({ type: 'CONTROL', action: 'pause' })); } else { ytPlayer.playVideo(); ws.send(JSON.stringify({ type: 'CONTROL', action: 'play' })); } } function skipTime(offset) { if(!ytPlayer || !ytPlayer.getCurrentTime) return; flashRemoteLed(); triggerBrowserWakeup(); let t = ytPlayer.getCurrentTime() + offset; if (t < 0) t = 0; ytPlayer.seekTo(t, true); ws.send(JSON.stringify({ type: 'SEEK_TIME', time: t })); } function seekTimeline(value) { isDraggingSlider = false; if(!ytPlayer || !ytPlayer.getDuration) return; flashRemoteLed(); triggerBrowserWakeup(); const t = (value / 100) * ytPlayer.getDuration(); ytPlayer.seekTo(t, true); ws.send(JSON.stringify({ type: 'SEEK_TIME', time: t })); } function loadAndPlayYouTube(ytId, startTime = 0, meta = null) { document.getElementById('playerPlaceholder').classList.add('hidden'); document.getElementById('musicPlayerUI').classList.remove('hidden'); let finalThumbUrl = `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg`; if (meta && meta.thumb) finalThumbUrl = meta.thumb; const corsProxiedUrl = `https://wsrv.nl/?url=${encodeURIComponent(finalThumbUrl)}`; const imgEl = document.getElementById('uiThumbnail'); imgEl.crossOrigin = "Anonymous"; imgEl.src = corsProxiedUrl; if (meta) { document.getElementById('uiTitle').textContent = meta.title || 'Unknown Title'; document.getElementById('uiArtist').textContent = meta.artist || 'Unknown Artist'; } else { document.getElementById('uiTitle').textContent =     <script>
        window.addEventListener('DOMContentLoaded', () => {
            const loadApp = (iframeId, sourceId, extraCss = '') => {
                let code = document.getElementById(sourceId).value;
                if (extraCss) { code = code.replace('</head>', `<style>${extraCss}</style></head>`); }
                const blob = new Blob([code], { type: 'text/html' });
                document.getElementById(iframeId).src = URL.createObjectURL(blob);
            };

            loadApp('frame-1', 'app1-source');
            loadApp('frame-2', 'app2-source');
            loadApp('frame-3', 'app3-source', 'body { padding-bottom: 100px !important; }');
            
            switchTab(0, '#ef4444');
        });

        const slider = document.getElementById('slider');
        const indicator = document.getElementById('tab-indicator');
        const tabBtns = document.querySelectorAll('.tab-btn');

        function switchTab(index, colorHex) {
            slider.style.transform = `translateX(-${index * 100}vw)`;
            const positions = ['8px', 'calc(33.33% + 4px)', 'calc(66.66% + 0px)'];
            indicator.style.left = positions[index];
            indicator.style.background = `rgba(${hexToRgb(colorHex)}, 0.25)`;

            tabBtns.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
                btn.style.color = i === index ? '#fff' : 'rgba(255,255,255,0.4)';
            });
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255,255,255';
        }
    </script>
