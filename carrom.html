<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncBeat Carrom Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.3/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; background: #07070a; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        .arcade-header { padding: 12px 16px; background: #121218; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 10; }
        .arcade-title { font-size: 13px; font-weight: 900; color: #f59e0b; display: flex; align-items: center; gap: 8px; }

        .game-arena { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #proGameFrame { width: 100%; height: 100%; border: none; background: #121218; }

        /* Social Drawer */
        .social-drawer { height: 150px; background: rgba(14, 14, 18, 0.95); display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.08); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 8px; max-width: 85%; }
        .chat-input-bar { padding: 6px 10px; display: flex; gap: 6px; background: rgba(0,0,0,0.3); }
        .chat-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 10px; color: #fff; font-size: 11px; outline: none; }
        .chat-send { background: #f59e0b; border: none; color: #fff; padding: 0 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px; }

        /* Setup Modal Overlay */
        #roomSetupModal { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .setup-card { background: #121218; width: 100%; max-width: 320px; border-radius: 20px; padding: 20px; border: 1px solid rgba(245, 158, 11, 0.3); text-align: center; }
        .input-glass { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; font-size: 13px; color: #fff; outline: none; margin-bottom: 12px; text-align: center; }
        .btn-glass { width: 100%; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; border: none; margin-bottom: 8px; }
        .btn-host { background: #f59e0b; color: #fff; }
        .btn-join { background: #3b82f6; color: #fff; }
    </style>
</head>
<body>

    <div class="arcade-header">
        <div class="arcade-title" id="topHeaderTitle"><i class="fa-solid fa-bullseye"></i> SyncBeat Carrom</div>
        <button id="leaveRoomBtn" style="display:none; background:#ef4444; border:none; color:#fff; padding:5px 10px; border-radius:6px; font-size:10px; font-weight:800; cursor:pointer;" onclick="leaveGame()">Quit Match</button>
    </div>

    <div class="game-arena">
        <iframe id="proGameFrame" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="social-drawer">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg" style="color: #94a3b8;">System: Enter a room code to start playing.</div>
        </div>
        <div class="chat-input-bar">
            <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="chat-send" onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <div id="roomSetupModal">
        <div class="setup-card">
            <div style="font-size: 16px; font-weight: 800; color: #f59e0b; margin-bottom: 15px;">Carrom Multiplayer Room</div>
            <input type="text" id="roomCodeInput" class="input-glass" placeholder="Enter Room Code">
            <button class="btn-glass btn-host" onclick="startGame('host')">Host Match</button>
            <button class="btn-glass btn-join" onclick="startGame('join')">Join Match</button>
        </div>
    </div>

    <script>
        const socket = io('https://syncbeat-server-pvix.onrender.com');
        let activeCode = null;

        function startGame(type) {
            let code = document.getElementById('roomCodeInput').value.trim();
            if (type === 'host') {
                code = 'CARROM-' + Math.floor(1000 + Math.random() * 9000);
            } else if (type === 'join' && !code) {
                alert("Enter a room code to join!"); return;
            }

            activeCode = code;
            socket.emit('join_room', activeCode);

            document.getElementById('roomSetupModal').style.display = 'none';
            document.getElementById('leaveRoomBtn').style.display = 'block';
            document.getElementById('topHeaderTitle').innerHTML = `<i class="fa-solid fa-bullseye"></i> CARROM [${activeCode}]`;
            document.getElementById('chatMessages').innerHTML = `<div class="chat-msg" style="color:#f59e0b;">System: Connected to [${activeCode}]</div>`;

            // Professional WebGL Carrom Engine Frame
            document.getElementById('proGameFrame').src = 'https://www.crazygames.com/embed/carrom-clash';

            // Hide Master Navigation Bar via PostMessage
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_OPENED' }, '*');
        }

        function leaveGame() {
            activeCode = null;
            document.getElementById('proGameFrame').src = '';
            document.getElementById('roomSetupModal').style.display = 'flex';
            document.getElementById('leaveRoomBtn').style.display = 'none';
            document.getElementById('topHeaderTitle').innerHTML = `<i class="fa-solid fa-bullseye"></i> SyncBeat Carrom`;
            
            // Restore Master Navigation Bar
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_CLOSED' }, '*');
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            document.getElementById('chatMessages').innerHTML += `<div class="chat-msg self"><b>You:</b> ${text}</div>`;
            socket.emit('send_chat', { room: activeCode, message: text });
            input.value = '';
        }

        socket.on('receive_chat', (msg) => {
            document.getElementById('chatMessages').innerHTML += `<div class="chat-msg"><b>Opponent:</b> ${msg}</div>`;
        });
    </script>
</body>
</html>
