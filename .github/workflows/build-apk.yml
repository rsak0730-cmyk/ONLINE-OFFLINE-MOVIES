name: Build SyncBeat APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Determine build flags
        id: flags
        run: |
          BT="${{ github.event.inputs.build_type }}"
          if [ -z "$BT" ] || [ "$BT" = "both" ]; then
            echo "debug=true" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
          elif [ "$BT" = "debug" ]; then
            echo "debug=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "debug=false" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        if: steps.flags.outputs.debug == 'true'
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK (installable, debug-signed)
        if: steps.flags.outputs.release == 'true'
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List APKs
        run: |
          echo "=== Built APKs ==="
          find app/build/outputs/apk -type f -name '*.apk' -exec ls -lh {} \;

      - name: Rename APKs for easy download
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/SyncBeat-v2.0.0-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/SyncBeat-v2.0.0-release.apk
          fi
          # fallback names
          find app/build/outputs/apk -name '*.apk' -print
          ls -lah dist/ || true

      - name: Upload SyncBeat APKs
        uses: actions/upload-artifact@v4
        with:
          name: SyncBeat-APK
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 90
