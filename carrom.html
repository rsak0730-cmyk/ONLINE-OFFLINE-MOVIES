<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncBeat Carrom Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.3/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
        body, html { width: 100vw; height: 100vh; background: #07070a; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        .arcade-header { padding: 12px 16px; background: #121218; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 10; }
        .arcade-title { font-size: 13px; font-weight: 900; color: #f59e0b; display: flex; align-items: center; gap: 8px; }

        .game-arena { flex: 1; background: #0a0a0f; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        canvas { background: #d97736; border: 16px solid #451a03; border-radius: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); width: 90vw; height: 90vw; max-width: 360px; max-height: 360px; }
        
        .social-drawer { height: 140px; background: rgba(14, 14, 18, 0.95); display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.08); z-index: 10; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; max-width: 85%; }
        .chat-input-bar { padding: 6px 10px; display: flex; gap: 6px; background: rgba(0,0,0,0.3); }
        .chat-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 10px; color: #fff; font-size: 11px; outline: none; }
        .chat-send { background: #f59e0b; border: none; color: #fff; padding: 0 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px; }

        #roomSetupModal { position: absolute; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .setup-card { background: #121218; width: 100%; max-width: 300px; border-radius: 20px; padding: 20px; border: 1px solid rgba(245, 158, 11, 0.3); text-align: center; }
        .input-glass { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; font-size: 13px; color: #fff; outline: none; margin-bottom: 12px; text-align: center; }
        .btn-glass { width: 100%; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; border: none; margin-bottom: 8px; }
        .btn-host { background: #f59e0b; color: #fff; }
        .btn-join { background: #3b82f6; color: #fff; }
    </style>
</head>
<body>

    <div class="arcade-header">
        <div class="arcade-title" id="roomTitle"><i class="fa-solid fa-bullseye"></i> SyncBeat Carrom</div>
        <button id="leaveBtn" style="display:none; background:#ef4444; border:none; color:#fff; padding:5px 10px; border-radius:6px; font-size:10px; font-weight:800; cursor:pointer;" onclick="leaveGame()">Quit</button>
    </div>
    
    <div class="game-area">
        <canvas id="carromCanvas" width="400" height="400"></canvas>
    </div>

    <div class="social-drawer">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg" style="color: #f59e0b;">System: Enter a room code to begin.</div>
        </div>
        <div class="chat-input-bar">
            <input type="text" id="chatInput" class="chat-input" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="chat-send" onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <div id="roomSetupModal">
        <div class="setup-card">
            <div style="font-size: 15px; font-weight: 800; color: #f59e0b; margin-bottom: 12px;">Carrom Multiplayer</div>
            <input type="text" id="roomCodeInput" class="input-glass" placeholder="Enter Room Code">
            <button class="btn-glass btn-host" onclick="joinGame('host')">Host Match</button>
            <button class="btn-glass btn-join" onclick="joinGame('join')">Join Match</button>
        </div>
    </div>

    <script>
        const socket = io('https://syncbeat-server-pvix.onrender.com');
        let activeCode = null;

        function joinGame(type) {
            let code = document.getElementById('roomCodeInput').value.trim();
            if (type === 'host') code = 'CARROM-' + Math.floor(1000 + Math.random() * 9000);
            if (!code) return alert("Enter code!");
            activeCode = code;
            socket.emit('join_room', code);
            
            document.getElementById('roomSetupModal').style.display = 'none';
            document.getElementById('leaveBtn').style.display = 'block';
            document.getElementById('roomTitle').innerHTML = `<i class="fa-solid fa-bullseye"></i> CARROM [${code}]`;
            
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_OPENED', tab: 4, code: code }, '*');
        }

        function leaveGame() {
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_CLOSED' }, '*');
            location.reload();
        }

        const cvs = document.getElementById('carromCanvas');
        const ctx = cvs.getContext('2d');
        let coins = [];
        
        function initBoard() {
            coins = [{ id: 'queen', c: '#dc2626', x: 200, y: 200, r: 10, vx: 0, vy: 0, mass: 1 }];
            for(let i=0; i<6; i++) {
                let angle = i * (Math.PI / 3);
                coins.push({ id: `w1_${i}`, c: '#f8fafc', x: 200 + Math.cos(angle)*21, y: 200 + Math.sin(angle)*21, r: 10, vx: 0, vy: 0, mass: 1 });
            }
            for(let i=0; i<12; i++) {
                let angle = i * (Math.PI / 6);
                let color = i % 2 === 0 ? '#1e293b' : '#f8fafc';
                coins.push({ id: `ring2_${i}`, c: color, x: 200 + Math.cos(angle)*42, y: 200 + Math.sin(angle)*42, r: 10, vx: 0, vy: 0, mass: 1 });
            }
            coins.push({ id: 'striker', c: '#fbbf24', x: 200, y: 310, r: 14, vx: 0, vy: 0, mass: 1.6 });
        }
        initBoard();

        let isDragging = false;
        let startX, startY;
        let striker = coins.find(c => c.id === 'striker');

        cvs.addEventListener('pointerdown', (e) => {
            const rect = cvs.getBoundingClientRect();
            startX = (e.clientX - rect.left) * (cvs.width / rect.width);
            startY = (e.clientY - rect.top) * (cvs.height / rect.height);
            if (Math.hypot(startX - striker.x, startY - striker.y) < 30) isDragging = true;
        });

        cvs.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            const rect = cvs.getBoundingClientRect();
            const endX = (e.clientX - rect.left) * (cvs.width / rect.width);
            const endY = (e.clientY - rect.top) * (cvs.height / rect.height);
            striker.vx = (startX - endX) * 0.18;
            striker.vy = (startY - endY) * 0.18;
            isDragging = false;
        });

        function resolveCollision(a, b) {
            let dx = b.x - a.x; let dy = b.y - a.y; let dist = Math.hypot(dx, dy);
            if (dist < a.r + b.r) {
                let overlap = (a.r + b.r - dist) / 2;
                let nx = dx / dist, ny = dy / dist;
                a.x -= nx * overlap; a.y -= ny * overlap;
                b.x += nx * overlap; b.y += ny * overlap;
                let kx = b.vx - a.vx; let ky = b.vy - a.vy;
                let p = 2 * (nx * kx + ny * ky) / (a.mass + b.mass);
                a.vx += p * b.mass * nx; a.vy += p * b.mass * ny;
                b.vx -= p * a.mass * nx; b.vy -= p * a.mass * ny;
            }
        }

        function updatePhysics() {
            let moved = false;
            for (let i = 0; i < coins.length; i++) {
                let c = coins[i];
                if (Math.abs(c.vx) > 0.01 || Math.abs(c.vy) > 0.01) {
                    moved = true;
                    c.vx *= 0.98; c.vy *= 0.98;
                    c.x += c.vx; c.y += c.vy;
                    if (c.x < c.r || c.x > cvs.width - c.r) { c.vx *= -0.8; c.x = Math.max(c.r, Math.min(cvs.width - c.r, c.x)); }
                    if (c.y < c.r || c.y > cvs.height - c.r) { c.vy *= -0.8; c.y = Math.max(c.r, Math.min(cvs.height - c.r, c.y)); }
                }
                for (let j = i + 1; j < coins.length; j++) resolveCollision(c, coins[j]);
            }
            if (moved && activeCode) socket.emit('sync_carrom', { room: activeCode, boardData: coins });
        }

        socket.on('receive_carrom', (boardData) => {
            boardData.forEach((netCoin) => {
                let local = coins.find(c => c.id === netCoin.id);
                if (local) { local.x = netCoin.x; local.y = netCoin.y; local.vx = netCoin.vx; local.vy = netCoin.vy; }
            });
        });

        function draw() {
            updatePhysics();
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            
            ctx.beginPath(); ctx.arc(200, 200, 38, 0, Math.PI*2); ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2; ctx.stroke();
            const pockets = [[18,18], [382,18], [18,382], [382,382]];
            pockets.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 18, 0, Math.PI*2); ctx.fillStyle='#0f172a'; ctx.fill(); });
            
            coins.forEach(c => {
                ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fillStyle = c.c; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
            });
            requestAnimationFrame(draw);
        }
        draw();

        function sendChatMessage() {
            const txt = document.getElementById('chatInput').value.trim();
            if(!txt) return;
            document.getElementById('chatMessages').innerHTML += `<div class="chat-msg self"><b>You:</b> ${txt}</div>`;
            socket.emit('send_chat', { room: activeCode, message: txt });
            document.getElementById('chatInput').value = ``;
            document.getElementById('chatInput').value = '';
        }
        socket.on('receive_chat', (msg) => document.getElementById('chatMessages').innerHTML += `<div class="chat-msg"><b>Opponent:</b> ${msg}</div>`);
    </script>
</body>
</html>
