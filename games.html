<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncBeat Arcade & Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100vw; height: 100vh; background: #07070a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; display: flex; flex-direction: column; }

        .arcade-header { padding: 14px 20px; background: rgba(18,18,24,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .arcade-title { font-size: 14px; font-weight: 900; color: #3b82f6; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }

        .arcade-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 80px; }

        #lobbyView { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .glass-card { background: rgba(22, 22, 32, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-header { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; color: #3b82f6; }
        
        .input-glass { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #fff; outline: none; margin-bottom: 10px; }
        
        /* Search Bar */
        .search-container { position: relative; margin-bottom: 12px; }
        .search-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .search-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 14px 12px 38px; font-size: 13px; color: #fff; outline: none; transition: border 0.3s; }
        .search-input:focus { border-color: #3b82f6; }

        .btn-row { display: flex; gap: 10px; }
        .btn-glass { flex: 1; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 800; cursor: pointer; border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-host { background: #3b82f6; color: #fff; }
        .btn-join { background: rgba(255,255,255,0.1); color: #fff; }

        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 220px; overflow-y: auto; padding-right: 4px; }
        .game-opt { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .game-opt.selected { background: rgba(59, 130, 246, 0.25); border-color: #3b82f6; }
        .game-opt i { font-size: 20px; color: #3b82f6; margin-bottom: 6px; display: block; }
        .game-opt span { font-size: 11px; font-weight: 700; }

        #gameRoomView { flex: 1; display: none; flex-direction: column; height: 100%; }
        #gameRoomView.active { display: flex; }

        .arena-container { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.1); }
        #gameFrame { width: 100%; height: 100%; border: none; }

        .chat-container { height: 160px; background: rgba(14, 14, 18, 0.95); display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.08); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 10px; max-width: 80%; word-break: break-word; }
        .chat-msg.self { background: rgba(59, 130, 246, 0.25); align-self: flex-end; }
        
        .chat-input-bar { padding: 8px 12px; display: flex; gap: 8px; background: rgba(0,0,0,0.3); }
        .chat-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 8px 12px; color: #fff; font-size: 12px; outline: none; }
        .chat-send { background: #3b82f6; border: none; color: #fff; padding: 0 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="arcade-header">
        <div class="arcade-title"><i class="fa-solid fa-gamepad"></i> SyncBeat Arcade</div>
        <button id="leaveRoomBtn" style="display:none; background:#ef4444; border:none; color:#fff; padding:6px 12px; border-radius:8px; font-size:10px; font-weight:800; cursor:pointer;" onclick="leaveRoom()">Close Room</button>
    </div>

    <div class="arcade-body">
        <div id="lobbyView">
            <div class="glass-card">
                <div class="card-header">Select Game Library (10,000+)</div>
                
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search for games..." onkeyup="filterGames()">
                </div>

                <div class="games-grid" id="gamesGrid">
                    <!-- Games generated by JavaScript -->
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header">Room Control</div>
                <input type="text" id="roomCodeInput" class="input-glass" placeholder="Enter Room Code (e.g. GAME-99)">
                <div class="btn-row">
                    <button class="btn-glass btn-host" onclick="handleRoomAction('host')"><i class="fa-solid fa-plus-circle"></i> Host Room</button>
                    <button class="btn-glass btn-join" onclick="handleRoomAction('join')"><i class="fa-solid fa-right-to-bracket"></i> Join Room</button>
                </div>
            </div>
        </div>

        <div id="gameRoomView">
            <div class="arena-container">
                <iframe id="gameFrame" src=""></iframe>
            </div>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-msg" style="color: #94a3b8;">System: Connected to Game Room. Chat with your friends live!</div>
                </div>
                <div class="chat-input-bar">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                    <button class="chat-send" onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Highly scalable array for 10,000+ games. You can import JSON APIs here later.
        const gameLibrary = [
            { id: 'ludo', title: 'Ludo Battle', icon: 'fa-chess-board', url: 'https://html5.gamedistribution.com/a42b102efb4c48979e2ea41398858e65/' },
            { id: 'tictactoe', title: 'Tic Tac Toe', icon: 'fa-xmark', url: 'https://html5.gamedistribution.com/3932824cfd834c8a8344e7c3c5ee9a07/' },
            { id: 'racing', title: 'Cyber Cars', icon: 'fa-car', url: 'https://html5.gamedistribution.com/rvvASMiM/a88372671c6644f88424268e37746765/' },
            { id: 'pool', title: '8-Ball Pool', icon: 'fa-circle', url: 'https://html5.gamedistribution.com/rvvASMiM/pool-8-ball/' },
            { id: 'chess', title: 'Chess Masters', icon: 'fa-chess-knight', url: 'https://html5.gamedistribution.com/rvvASMiM/checkers/' },
            { id: 'uno', title: 'Uno Online', icon: 'fa-layer-group', url: 'https://html5.gamedistribution.com/rvvASMiM/uno-online/' },
            { id: 'hockey', title: 'Air Hockey', icon: 'fa-bullseye', url: 'https://html5.gamedistribution.com/rvvASMiM/air-hockey/' },
            { id: 'snake', title: 'Snake Arena', icon: 'fa-worm', url: 'https://html5.gamedistribution.com/rvvASMiM/snake-arena/' }
        ];

        let currentSelectedGameUrl = gameLibrary[0].url;
        let activeCode = null;

        // Render games dynamically
        function renderGames(filterText = '') {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            const filtered = gameLibrary.filter(g => g.title.toLowerCase().includes(filterText.toLowerCase()));
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #94a3b8; padding: 20px;">No games found</div>';
                return;
            }

            filtered.forEach((g, index) => {
                const isSelected = currentSelectedGameUrl === g.url;
                grid.innerHTML += `
                    <div class="game-opt ${isSelected ? 'selected' : ''}" onclick="selectGame(this, '${g.url}')">
                        <i class="fa-solid ${g.icon}"></i>
                        <span>${g.title}</span>
                    </div>
                `;
            });
        }

        function filterGames() {
            renderGames(document.getElementById('searchInput').value);
        }

        function selectGame(element, gameUrl) {
            currentSelectedGameUrl = gameUrl;
            document.querySelectorAll('.game-opt').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        function handleRoomAction(actionType) {
            let code = document.getElementById('roomCodeInput').value.trim();

            // Auto-generate code if hosting and input is empty
            if (actionType === 'host' && !code) {
                code = 'GAME-' + Math.floor(1000 + Math.random() * 9000);
                document.getElementById('roomCodeInput').value = code;
            } else if (actionType === 'join' && !code) {
                alert('Please enter a valid Room Code to join your friends!');
                return;
            }

            activeCode = code;
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_OPENED', tab: 3, code: activeCode }, '*');

            document.getElementById('gameFrame').src = currentSelectedGameUrl;
            document.getElementById('lobbyView').style.display = 'none';
            document.getElementById('gameRoomView').classList.add('active');
            document.getElementById('leaveRoomBtn').style.display = 'block';

            const box = document.getElementById('chatMessages');
            const actionText = actionType === 'host' ? 'Hosted' : 'Joined';
            box.innerHTML += `<div class="chat-msg" style="color:#3b82f6;">System: You ${actionText} room [${activeCode}]</div>`;
        }

        function leaveRoom() {
            activeCode = null;
            document.getElementById('gameFrame').src = '';
            document.getElementById('gameRoomView').classList.remove('active');
            document.getElementById('lobbyView').style.display = 'flex';
            document.getElementById('leaveRoomBtn').style.display = 'none';

            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_CLOSED' }, '*');
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const box = document.getElementById('chatMessages');
            box.innerHTML += `<div class="chat-msg self"><b>You:</b> ${text}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;
        }

        // Initialize Library
        renderGames();
    </script>
</body>
</html>
