<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat - Unified Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { position: fixed; width: 100vw; height: 100vh; overflow: hidden; overscroll-behavior: none; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        #slider { display: flex; width: 500vw; height: 100vh; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .frame-wrapper { width: 100vw; height: 100vh; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        .tab-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 96%; max-width: 420px; height: 60px; background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 10000; transition: transform 0.4s ease, opacity 0.4s ease; }
        .tab-bar.hide { transform: translateX(-50%) translateY(120px); opacity: 0; pointer-events: none; }
        
        .indicator { position: absolute; top: 6px; bottom: 6px; width: calc(20% - 6px); left: 4px; background: rgba(239, 68, 68, 0.25); border-radius: 24px; transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease; z-index: 1; }
        
        .tab-btn { flex: 1; height: 100%; border: none; background: transparent; color: rgba(255, 255, 255, 0.4); font-size: 9px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; z-index: 2; cursor: pointer; transition: color 0.3s ease; text-transform: uppercase; }
        .tab-btn i { font-size: 16px; transition: transform 0.3s cubic-bezier(0.2, 2, 0.4, 1); }
        .tab-btn.active { color: #fff; }
        .tab-btn.active i { transform: translateY(-2px) scale(1.1); }
        
        #toast { position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-120px); background: rgba(20, 8, 8, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(239, 68, 68, 0.6); color: #fecaca; padding: 12px 20px; border-radius: 20px; font-size: 12px; font-weight: 800; z-index: 100000; display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        #toast.show { transform: translateX(-50%) translateY(0); }

        #videoSplashOverlay { position: fixed; inset: 0; background: #000; z-index: 99999999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease, visibility 0.6s ease; }
        #videoSplashOverlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        #splashVideo { width: 100%; height: 100%; object-fit: cover; }
        #skipSplashBtn { position: absolute; top: 40px; right: 20px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; font-size: 11px; font-weight: 800; padding: 8px 16px; border-radius: 20px; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

    <div id="videoSplashOverlay">
        <video id="splashVideo" autoplay muted playsinline><source src="intro.mp4" type="video/mp4"></video>
        <button id="skipSplashBtn" onclick="dismissSplashScreen()">Skip</button>
    </div>

    <div id="toast"><i class="fa-solid fa-lock" style="color: #ef4444;"></i> <span id="toastMsg"></span></div>

    <div id="slider">
        <div class="frame-wrapper"><iframe src="./movies.html"></iframe></div>
        <div class="frame-wrapper"><iframe src="./golden.html"></iframe></div>
        <div class="frame-wrapper"><iframe src="./audio.html"></iframe></div>
        <div class="frame-wrapper"><iframe src="./ludo.html"></iframe></div>
        <div class="frame-wrapper"><iframe src="./carrom.html"></iframe></div>
    </div>

    <nav class="tab-bar" id="tabBar">
        <div class="indicator" id="indicator"></div>
        <button class="tab-btn active" onclick="switchTab(0, '#ef4444')"><i class="fa-solid fa-film"></i><span>Movies</span></button>
        <button class="tab-btn" onclick="switchTab(1, '#fbbf24')"><i class="fa-brands fa-youtube"></i><span>Golden</span></button>
        <button class="tab-btn" onclick="switchTab(2, '#a855f7')"><i class="fa-solid fa-compact-disc"></i><span>Audio</span></button>
        <button class="tab-btn" onclick="switchTab(3, '#ef4444')"><i class="fa-solid fa-chess-board"></i><span>Ludo</span></button>
        <button class="tab-btn" onclick="switchTab(4, '#f59e0b')"><i class="fa-solid fa-bullseye"></i><span>Carrom</span></button>
    </nav>

    <script>
        const splashOverlay = document.getElementById('videoSplashOverlay');
        function dismissSplashScreen() {
            splashOverlay.classList.add('fade-out');
            setTimeout(() => splashOverlay.remove(), 650);
        }
        setTimeout(dismissSplashScreen, 8000);

        let activeRoomTab = null;
        let activeRoomCode = null;

        window.addEventListener('message', (e) => {
            if (e.data.sender !== 'syncbeat') return;
            if (e.data.action === 'ROOM_OPENED') {
                activeRoomTab = e.data.tab;
                activeRoomCode = e.data.code;
            } else if (e.data.action === 'ROOM_CLOSED') {
                activeRoomTab = null;
                activeRoomCode = null;
            }
        });

        function switchTab(index, color) {
            if (activeRoomTab !== null && activeRoomTab !== index) {
                document.getElementById('toastMsg').textContent = `Active Room [${activeRoomCode}]. Close it first!`;
                document.getElementById('toast').classList.add('show');
                setTimeout(() => document.getElementById('toast').classList.remove('show'), 3500);
                return;
            }

            document.getElementById('slider').style.transform = `translateX(-${index * 100}vw)`;
            const pos = ['4px', 'calc(20% + 1px)', 'calc(40% - 1px)', 'calc(60% - 3px)', 'calc(80% - 4px)'];
            document.getElementById('indicator').style.left = pos[index];
            document.getElementById('indicator').style.background = color + '40';

            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
                btn.style.color = i === index ? '#fff' : 'rgba(255,255,255,0.4)';
            });
        }
    </script>
</body>
</html>
