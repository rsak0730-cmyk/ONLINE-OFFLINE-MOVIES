<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat Inbuilt Games</title>
    <!-- WebSockets Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.3/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100vw; height: 100vh; background: #07070a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; display: flex; flex-direction: column; }

        .arcade-header { padding: 14px 20px; background: rgba(18,18,24,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .arcade-title { font-size: 14px; font-weight: 900; color: #3b82f6; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }

        .arcade-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 80px; }

        /* Modern Game Selection Lobby */
        #gameSelectView { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .game-banner { width: 100%; max-width: 400px; height: 160px; border-radius: 24px; position: relative; overflow: hidden; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); transition: transform 0.2s; }
        .game-banner:active { transform: scale(0.96); }
        .game-banner.ludo { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .game-banner.carrom { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .banner-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); }
        .banner-content i { font-size: 48px; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .banner-content span { font-size: 20px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* Room Setup Modal */
        #roomSetupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .setup-card { background: #121218; width: 100%; max-width: 340px; border-radius: 24px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .setup-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: #3b82f6; }
        .input-glass { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px; font-size: 14px; color: #fff; outline: none; margin-bottom: 14px; text-align: center; }
        .btn-row { display: flex; gap: 10px; }
        .btn-glass { flex: 1; padding: 14px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; border: none; transition: 0.2s; }
        .btn-host { background: #3b82f6; color: #fff; }
        .btn-join { background: #22c55e; color: #fff; }
        .btn-cancel { background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); margin-top: 10px; width: 100%; }

        /* Active Sandbox Arena */
        #activeGameArena { flex: 1; display: none; flex-direction: column; height: 100%; position: relative; }
        #activeGameArena.active { display: flex; }
        
        .game-board-area { flex: 1; background: #0a0a0f; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* Interactive Sandbox Board */
        .sandbox-board { width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; border-radius: 16px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.8); overflow: hidden; touch-action: none; }
        
        /* CSS Ludo Board */
        .board-ludo { background: #f8fafc; border: 4px solid #0f172a; }
        .ludo-base { position: absolute; width: 40%; height: 40%; border: 2px solid #0f172a; }
        .ludo-red { top: 0; left: 0; background: #ef4444; }
        .ludo-green { top: 0; right: 0; background: #22c55e; }
        .ludo-blue { bottom: 0; left: 0; background: #3b82f6; }
        .ludo-yellow { bottom: 0; right: 0; background: #eab308; }
        .ludo-center { position: absolute; top: 40%; left: 40%; width: 20%; height: 20%; background: #94a3b8; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
        
        /* CSS Carrom Board */
        .board-carrom { background: #d97736; border: 18px solid #5a3219; }
        .board-carrom::after { content: ''; position: absolute; top: 15%; left: 15%; right: 15%; bottom: 15%; border: 3px solid rgba(0,0,0,0.2); border-radius: 50%; pointer-events: none; }

        /* Draggable Tokens */
        .token { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 4px 6px rgba(0,0,0,0.5); cursor: grab; transform: translate(-50%, -50%); transition: left 0.05s, top 0.05s; }
        .token:active { cursor: grabbing; box-shadow: 0 10px 15px rgba(0,0,0,0.8); }

        /* Animated Dice */
        .dice-container { position: absolute; bottom: 20px; right: 20px; width: 55px; height: 55px; background: #fff; border-radius: 14px; display: none; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: pointer; border: 2px solid #e2e8f0; z-index: 5; }
        .dice-container i { font-size: 30px; color: #0f172a; }
        .dice-container.rolling { animation: roll 0.4s ease-in-out infinite alternate; pointer-events: none; }
        @keyframes roll { 0% { transform: rotate(0deg) scale(1) translateY(0); } 100% { transform: rotate(180deg) scale(1.2) translateY(-15px); } }

        /* Live Chat & Emoji Drawer */
        .social-drawer { height: 180px; background: rgba(14, 14, 18, 0.95); display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.08); z-index: 10; }
        .emoji-bar { display: flex; gap: 12px; padding: 10px 14px; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .emoji-btn { font-size: 24px; background: transparent; border: none; cursor: pointer; transition: transform 0.2s; }
        .emoji-btn:active { transform: scale(1.4); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 10px; max-width: 80%; word-break: break-word; }
        .chat-msg.self { background: rgba(59, 130, 246, 0.25); align-self: flex-end; }
        .chat-input-bar { padding: 8px 12px; display: flex; gap: 8px; background: rgba(0,0,0,0.3); }
        .chat-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 8px 12px; color: #fff; font-size: 12px; outline: none; }
        .chat-send { background: #3b82f6; border: none; color: #fff; padding: 0 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        /* Floating Emoji Animation */
        #emojiOverlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
        .floating-emoji { position: absolute; bottom: 20px; font-size: 40px; animation: floatUp 2.2s ease-out forwards; opacity: 1; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { transform: translateY(-40px) scale(1.2); opacity: 1; } 100% { transform: translateY(-300px) scale(1); opacity: 0; } }
    </style>
</head>
<body>

    <div class="arcade-header">
        <div class="arcade-title" id="topHeaderTitle"><i class="fa-solid fa-gamepad"></i> SyncBeat Games</div>
        <button id="leaveRoomBtn" style="display:none; background:#ef4444; border:none; color:#fff; padding:6px 12px; border-radius:8px; font-size:10px; font-weight:800; cursor:pointer;" onclick="leaveGame()">Quit Match</button>
    </div>

    <div class="arcade-body">
        <div id="gameSelectView">
            <div class="game-banner ludo" onclick="openSetup('Ludo')">
                <div class="banner-content"><i class="fa-solid fa-chess-board"></i><span>Play Ludo</span></div>
            </div>
            <div class="game-banner carrom" onclick="openSetup('Carrom')">
                <div class="banner-content"><i class="fa-solid fa-bullseye"></i><span>Play Carrom</span></div>
            </div>
        </div>

        <div id="activeGameArena">
            <div class="game-board-area">
                <div id="emojiOverlay"></div>
                <div class="sandbox-board" id="gameBoard"></div>
                <div class="dice-container" id="diceBtn" onclick="rollDice()"><i class="fa-solid fa-dice-one" id="diceIcon"></i></div>
            </div>

            <div class="social-drawer">
                <div class="emoji-bar">
                    <button class="emoji-btn" onclick="sendReaction('😂')">😂</button>
                    <button class="emoji-btn" onclick="sendReaction('😡')">😡</button>
                    <button class="emoji-btn" onclick="sendReaction('😎')">😎</button>
                    <button class="emoji-btn" onclick="sendReaction('😭')">😭</button>
                    <button class="emoji-btn" onclick="sendReaction('🔥')">🔥</button>
                    <button class="emoji-btn" onclick="sendReaction('💖')">💖</button>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-bar">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Trash talk here..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                    <button class="chat-send" onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="roomSetupModal">
        <div class="setup-card">
            <div class="setup-title" id="setupTitle">Setup Game</div>
            <input type="text" id="roomCodeInput" class="input-glass" placeholder="Enter Code to Join">
            <div class="btn-row">
                <button class="btn-glass btn-host" onclick="startGame('host')">Host Match</button>
                <button class="btn-glass btn-join" onclick="startGame('join')">Join Match</button>
            </div>
            <button class="btn-glass btn-cancel" onclick="closeSetup()">Cancel</button>
        </div>
    </div>

    <script>
        // CRITICAL: Link this to your live server.js URL
        const socket = io('https://your-backend-url.onrender.com'); 

        let selectedGame = null;
        let activeCode = null;
        let activeToken = null;
        let lastEmit = 0;
        
        const setupModal = document.getElementById('roomSetupModal');
        const gameSelectView = document.getElementById('gameSelectView');
        const activeGameArena = document.getElementById('activeGameArena');
        const board = document.getElementById('gameBoard');
        const diceBtn = document.getElementById('diceBtn');

        function openSetup(gameName) {
            selectedGame = gameName;
            document.getElementById('setupTitle').innerText = `Play ${gameName}`;
            document.getElementById('roomCodeInput').value = '';
            setupModal.style.display = 'flex';
        }

        function closeSetup() { setupModal.style.display = 'none'; selectedGame = null; }

        function startGame(type) {
            let code = document.getElementById('roomCodeInput').value.trim();
            if (type === 'host') {
                code = selectedGame.toUpperCase() + '-' + Math.floor(1000 + Math.random() * 9000);
            } else if (type === 'join' && !code) {
                alert("Enter a room code to join!"); return;
            }

            activeCode = code;
            socket.emit('join_room', activeCode);
            closeSetup();

            gameSelectView.style.display = 'none';
            activeGameArena.classList.add('active');
            document.getElementById('leaveRoomBtn').style.display = 'block';
            document.getElementById('topHeaderTitle').innerHTML = `<i class="fa-solid fa-gamepad"></i> ${selectedGame} [${activeCode}]`;
            
            diceBtn.style.display = selectedGame === 'Ludo' ? 'flex' : 'none';
            document.getElementById('chatMessages').innerHTML = `<div class="chat-msg" style="color:#3b82f6;">System: Match started in room [${activeCode}]</div>`;

            renderBoard(selectedGame);
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_OPENED', tab: 3, code: activeCode }, '*');
        }

        function leaveGame() {
            activeCode = null;
            activeGameArena.classList.remove('active');
            gameSelectView.style.display = 'flex';
            document.getElementById('leaveRoomBtn').style.display = 'none';
            document.getElementById('topHeaderTitle').innerHTML = `<i class="fa-solid fa-gamepad"></i> SyncBeat Games`;
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_CLOSED' }, '*');
        }

        // --- Sandbox Physics Generation ---
        function renderBoard(game) {
            board.innerHTML = '';
            board.className = 'sandbox-board ' + (game === 'Ludo' ? 'board-ludo' : 'board-carrom');

            if (game === 'Ludo') {
                board.innerHTML += `<div class="ludo-base ludo-red"></div><div class="ludo-base ludo-green"></div><div class="ludo-base ludo-blue"></div><div class="ludo-base ludo-yellow"></div><div class="ludo-center"></div>`;
                const colors = [{c:'#ef4444', x:20, y:20}, {c:'#22c55e', x:80, y:20}, {c:'#3b82f6', x:20, y:80}, {c:'#eab308', x:80, y:80}];
                let idCounter = 0;
                colors.forEach(col => {
                    for(let i=0; i<4; i++) {
                        let ox = (i%2 === 0) ? -8 : 8; let oy = (i<2) ? -8 : 8;
                        createToken(`ludo-${idCounter++}`, col.c, 8, col.x + ox, col.y + oy);
                    }
                });
            } else {
                let idCounter = 0;
                createToken(`carrom-red`, '#ef4444', 6, 50, 50);
                for(let i=0; i<9; i++) {
                    createToken(`carrom-w-${i}`, '#f8fafc', 6, 50 + (Math.random()*20-10), 50 + (Math.random()*20-10));
                    createToken(`carrom-b-${i}`, '#0f172a', 6, 50 + (Math.random()*20-10), 50 + (Math.random()*20-10));
                }
                createToken(`striker`, '#f8fafc', 10, 50, 85);
            }
        }

        function createToken(id, color, sizePct, px, py) {
            const t = document.createElement('div');
            t.className = 'token'; t.id = id;
            t.style.backgroundColor = color;
            t.style.width = sizePct + '%'; t.style.height = sizePct + '%';
            t.style.left = px + '%'; t.style.top = py + '%';
            
            t.addEventListener('pointerdown', () => { activeToken = t; t.style.zIndex = 1000; });
            board.appendChild(t);
        }

        // --- Drag Physics Sync ---
        document.addEventListener('pointermove', (e) => {
            if (!activeToken) return;
            const rect = board.getBoundingClientRect();
            let x = ((e.clientX - rect.left) / rect.width) * 100;
            let y = ((e.clientY - rect.top) / rect.height) * 100;
            
            x = Math.max(0, Math.min(100, x)); y = Math.max(0, Math.min(100, y));
            activeToken.style.left = x + '%'; activeToken.style.top = y + '%';

            const now = Date.now();
            if(now - lastEmit > 40) {
                socket.emit('move_piece', { room: activeCode, id: activeToken.id, x: x, y: y });
                lastEmit = now;
            }
        });

        document.addEventListener('pointerup', () => {
            if (activeToken) {
                socket.emit('move_piece', { room: activeCode, id: activeToken.id, x: parseFloat(activeToken.style.left), y: parseFloat(activeToken.style.top) });
                activeToken.style.zIndex = ''; activeToken = null;
            }
        });

        socket.on('receive_move', (data) => {
            const t = document.getElementById(data.id);
            if(t) { t.style.left = data.x + '%'; t.style.top = data.y + '%'; }
        });

        // --- Dice Sync ---
        const diceIcons = ['fa-dice-one', 'fa-dice-two', 'fa-dice-three', 'fa-dice-four', 'fa-dice-five', 'fa-dice-six'];
        function rollDice() {
            if (diceBtn.classList.contains('rolling')) return;
            diceBtn.classList.add('rolling');
            const result = Math.floor(Math.random() * 6);
            socket.emit('roll_dice', { room: activeCode, result: result });
            setTimeout(() => {
                diceBtn.classList.remove('rolling');
                document.getElementById('diceIcon').className = `fa-solid ${diceIcons[result]}`;
            }, 600);
        }

        socket.on('receive_dice', (result) => {
            diceBtn.classList.add('rolling');
            setTimeout(() => {
                diceBtn.classList.remove('rolling');
                document.getElementById('diceIcon').className = `fa-solid ${diceIcons[result]}`;
            }, 600);
        });

        // --- Social Engine ---
        function sendChatMessage() {
            const text = document.getElementById('chatInput').value.trim();
            if (!text) return;
            document.getElementById('chatMessages').innerHTML += `<div class="chat-msg self"><b>You:</b> ${text}</div>`;
            socket.emit('send_chat', { room: activeCode, message: text });
            document.getElementById('chatInput').value = '';
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        socket.on('receive_chat', (data) => {
            const box = document.getElementById('chatMessages');
            box.innerHTML += data.sys ? `<div class="chat-msg" style="color:#3b82f6;">System: ${data.msg}</div>` : `<div class="chat-msg"><b>Opponent:</b> ${data.msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        function sendReaction(emoji) {
            triggerEmojiAnimation(emoji);
            socket.emit('send_emoji', { room: activeCode, emoji: emoji });
        }

        socket.on('receive_emoji', (emoji) => triggerEmojiAnimation(emoji));

        function triggerEmojiAnimation(emoji) {
            const overlay = document.getElementById('emojiOverlay');
            const el = document.createElement('div');
            el.className = 'floating-emoji'; el.innerText = emoji;
            el.style.left = Math.random() * 80 + '%';
            overlay.appendChild(el);
            setTimeout(() => el.remove(), 2200);
        }
    </script>
</body>
</html>
