<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat - Unified Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { position: fixed; width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        
        #authModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #121218; width: 100%; max-width: 320px; border-radius: 20px; padding: 24px; text-align: center; border: 1px solid rgba(59, 130, 246, 0.4); box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .auth-input { width: 100%; background: #000; border: 1px solid #333; border-radius: 10px; padding: 14px; color: #fff; margin: 20px 0; font-size: 16px; text-align: center; outline: none; }
        .auth-btn { width: 100%; padding: 14px; border-radius: 10px; background: #3b82f6; color: #fff; font-weight: 800; border: none; font-size: 14px; cursor: pointer; }
        .profile-badge { position: fixed; top: 15px; left: 15px; background: rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 20px; color: #fff; font-size: 11px; font-weight: 800; z-index: 10000; border: 1px solid rgba(255,255,255,0.2); }

        #slider { display: flex; width: 500vw; height: 100vh; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .frame-wrapper { width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; }

        .tab-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 96%; max-width: 420px; height: 60px; background: rgba(18, 18, 22, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px; display: flex; justify-content: space-between; padding: 0 4px; z-index: 10000; transition: transform 0.4s ease, opacity 0.4s ease; }
        .tab-bar.hide { transform: translateX(-50%) translateY(120px); opacity: 0; pointer-events: none; }
        
        .indicator { position: absolute; top: 6px; bottom: 6px; width: calc(20% - 6px); left: 4px; background: rgba(239, 68, 68, 0.25); border-radius: 24px; transition: 0.4s; z-index: 1; }
        .tab-btn { flex: 1; height: 100%; border: none; background: transparent; color: rgba(255,255,255,0.4); font-size: 9px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; z-index: 2; transition: 0.3s; text-transform: uppercase; }
        .tab-btn.active { color: #fff; }
    </style>
</head>
<body>

    <div id="authModal">
        <div class="auth-card">
            <i class="fa-solid fa-gamepad" style="font-size: 40px; color: #3b82f6; margin-bottom: 10px;"></i>
            <h2 style="color: #fff; font-size: 20px;">Create Account</h2>
            <p style="color: #94a3b8; font-size: 12px; margin-top: 5px;">Your ID will be backed up locally.</p>
            <input type="text" id="usernameInput" class="auth-input" placeholder="Enter Username" autocomplete="off">
            <button class="auth-btn" onclick="saveProfile()">Start Playing</button>
        </div>
    </div>

    <div class="profile-badge" id="profileBadge" style="display: none;"></div>

    <div id="slider">
        <div class="frame-wrapper"><iframe src="./movies.html"></iframe></div>
        <div class="frame-wrapper"><iframe src="./golden.html"></iframe></div>
        <div class="frame-wrapper"><iframe src="./audio.html"></iframe></div>
        <div class="frame-wrapper"><iframe id="ludoFrame" src="./ludo.html"></iframe></div>
        <div class="frame-wrapper"><iframe id="carromFrame" src="./carrom.html"></iframe></div>
    </div>

    <nav class="tab-bar" id="tabBar">
        <div class="indicator" id="indicator"></div>
        <button class="tab-btn active" onclick="switchTab(0, '#ef4444')"><i class="fa-solid fa-film"></i><span>Movies</span></button>
        <button class="tab-btn" onclick="switchTab(1, '#fbbf24')"><i class="fa-brands fa-youtube"></i><span>Golden</span></button>
        <button class="tab-btn" onclick="switchTab(2, '#a855f7')"><i class="fa-solid fa-compact-disc"></i><span>Audio</span></button>
        <button class="tab-btn" onclick="switchTab(3, '#ef4444')"><i class="fa-solid fa-chess-board"></i><span>Ludo</span></button>
        <button class="tab-btn" onclick="switchTab(4, '#f59e0b')"><i class="fa-solid fa-bullseye"></i><span>Carrom</span></button>
    </nav>

    <script>
        let playerProfile = JSON.parse(localStorage.getItem('syncbeat_profile'));

        if (playerProfile) {
            document.getElementById('authModal').style.display = 'none';
            loadProfileUI();
        }

        function saveProfile() {
            const name = document.getElementById('usernameInput').value.trim();
            if (!name) return alert('Enter a username');
            
            playerProfile = {
                id: 'UID-' + Math.random().toString(36).substr(2, 9).toUpperCase(),
                name: name,
                level: 1
            };
            localStorage.setItem('syncbeat_profile', JSON.stringify(playerProfile));
            document.getElementById('authModal').style.display = 'none';
            loadProfileUI();
        }

        function loadProfileUI() {
            const badge = document.getElementById('profileBadge');
            badge.style.display = 'block';
            badge.innerHTML = `<i class="fa-solid fa-user"></i> ${playerProfile.name} <span style="color:#94a3b8; font-weight:normal; margin-left:4px;">${playerProfile.id}</span>`;
        }

        // Listen for messages from Ludo or Carrom to hide navigation bar during match
        window.addEventListener('message', (e) => {
            if (e.data.sender !== 'syncbeat') return;
            const tabBar = document.getElementById('tabBar');
            if (e.data.action === 'ROOM_OPENED') {
                tabBar.classList.add('hide');
            } else if (e.data.action === 'ROOM_CLOSED') {
                tabBar.classList.remove('hide');
            }
        });

        function switchTab(index, color) {
            document.getElementById('slider').style.transform = `translateX(-${index * 100}vw)`;
            const pos = ['4px', 'calc(20% + 1px)', 'calc(40% - 1px)', 'calc(60% - 3px)', 'calc(80% - 4px)'];
            document.getElementById('indicator').style.left = pos[index];
            document.getElementById('indicator').style.background = color + '40';
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
                btn.style.color = i === index ? '#fff' : 'rgba(255,255,255,0.4)';
            });
        }
    </script>
</body>
</html>
